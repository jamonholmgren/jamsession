# Model tiers for `jamsession run --failover` and tier routes. Edit freely; to
# keep your own copy across updates, point JAMSESSION_TIERS at it (for example
# in jamsession.conf).
#
# Tiers run best and costliest first. Failover never moves to an earlier tier,
# and moves to a later one only with --allow-lower. Within a tier, models are
# tried in the order listed.
#
# Each model's `via` lists the harnesses that serve it, in the order failover
# tries them after the one requested: Devin first, then the native harness,
# then Cursor, except where a harness serves a newer version. A via entry may
# name an account from accounts.toml, for example
# `{ harness = "claude", account = "personal", id = "opus@latest" }`. Each
# account is its own usage pool. This shipped file does not name a personal
# account; add one in your own JAMSESSION_TIERS copy only for work you have
# decided may run there. `id` is
# `<family>@latest`: each harness's newest listed ID in that family, so this
# table always means the latest model. jamsession passes effort separately and
# each adapter maps it (Devin and Cursor append it to the ID).
# `efforts` maps a requested effort to one this harness accepts; unlisted
# efforts pass through. `meter = false` means `jamsession usage` does not track
# this pool (free SWE-2, Cursor's non-Grok allotment), so low usage never
# skips it.

tiers = [
  { name = "A", models = ["fable", "astra"] },
  { name = "B", models = ["opus", "sol"] },
  # Grok leads tier C; Wonder is tier C only at high effort; Sonnet and Terra
  # are last-resort failover, never a first choice.
  { name = "C", models = ["grok", "wonder", "sonnet", "terra"] },
  # SWE-2 leads tier D because it is free; then routes.toml's cheap order.
  { name = "D", models = ["swe-2", "luna", "haiku"] },
  { name = "F", models = ["swe-2-flash", "spark"] },
]

[model.fable]
via = [
  { harness = "devin", id = "fable@latest" },
  { harness = "claude", id = "fable@latest" },
  { harness = "cursor", id = "fable@latest", meter = false },
]

[model.astra]  # Codex first: it serves a newer Astra than Devin
via = [
  { harness = "codex", id = "astra@latest" },
  { harness = "devin", id = "astra@latest" },
]

[model.opus]
via = [
  { harness = "devin", id = "opus@latest" },
  { harness = "claude", id = "opus@latest" },
  { harness = "cursor", id = "opus@latest", meter = false },
]

[model.sol]  # Codex first: it serves a newer Sol than Devin
via = [
  { harness = "codex", id = "sol@latest" },
  { harness = "devin", id = "sol@latest" },
]

[model.grok]
via = [
  { harness = "devin", id = "grok@latest", efforts = { max = "xhigh" } },
  { harness = "grok", id = "grok@latest", efforts = { xhigh = "high", max = "high" } },
  { harness = "cursor", id = "grok@latest", efforts = { max = "xhigh" } },
]

[model.sonnet]
via = [
  { harness = "devin", id = "sonnet@latest" },
  { harness = "claude", id = "sonnet@latest" },
  { harness = "cursor", id = "sonnet@latest", meter = false },
]

[model.terra]
via = [
  { harness = "devin", id = "terra@latest" },
  { harness = "codex", id = "terra@latest" },
]

[model.swe-2]
via = [
  { harness = "devin", id = "swe-2@latest", meter = false, efforts = { low = "medium", xhigh = "max" } },
]

[model.luna]
via = [
  { harness = "devin", id = "luna@latest" },
  { harness = "codex", id = "luna@latest" },
]

[model.haiku]
via = [
  { harness = "devin", id = "haiku@latest" },
  { harness = "claude", id = "haiku@latest" },
  { harness = "cursor", id = "haiku@latest", meter = false },
]

[model.wonder]  # always high: Wonder is tier C only at high effort
via = [
  { harness = "devin", id = "wonder@latest", efforts = { default = "high", none = "high", minimal = "high", low = "high", medium = "high", xhigh = "high", max = "high" } },
  { harness = "muse", id = "wonder@latest", efforts = { default = "high", none = "high", minimal = "high", low = "high", medium = "high", xhigh = "high", max = "high" } },
  { harness = "cursor", id = "wonder@latest", meter = false, efforts = { default = "high", none = "high", minimal = "high", low = "high", medium = "high", xhigh = "high", max = "high" } },
]

[model.swe-2-flash]
via = [
  { harness = "devin", id = "swe-2-flash@latest", meter = false, efforts = { low = "medium", xhigh = "max" } },
]

[model.spark]
via = [
  { harness = "muse", id = "spark@latest" },
  { harness = "cursor", id = "spark@latest", meter = false },
]
